repos:
  - repo: local
    hooks:
      - id: py-compile
        name: compile Python files
        entry: python -m compileall -q main.py ptv_flow scripts tests
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
